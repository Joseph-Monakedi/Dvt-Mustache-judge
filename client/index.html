<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/dvt-logo.png" />
    <link rel="apple-touch-icon" href="/dvt-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var stored = localStorage.getItem("color-scheme") || "light dark";
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = stored;
        var resolved = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
    <meta name="theme-color" content="#070c14" />
    <title>The Movember Mustache Judge | DVT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
