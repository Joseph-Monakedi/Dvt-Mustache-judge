name: Run Backend Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Build & Run .NET Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore DvtMustacheJudge.slnx

      - name: Build Solution
        run: dotnet build DvtMustacheJudge.slnx --no-restore --configuration Release

      - name: Run Unit & Integration Tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ci-test-admin-password-2026
        run: dotnet test DvtMustacheJudge.Tests/DvtMustacheJudge.Tests.csproj --no-build --configuration Release --verbosity normal
